<svg xmlns="http://www.w3.org/2000/svg" width="760" height="210" viewBox="0 0 760 210" role="img" aria-labelledby="title"><title id="title">The same suffix distinguishes two prefixes</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs><rect width="760" height="210" rx="12" fill="#ffffff"/><g font-family="system-ui, sans-serif" font-size="18" fill="#172033"><rect x="30" y="30" width="170" height="52" rx="9" fill="#e8eefb" stroke="#475569"/><text x="115.0" y="61" text-anchor="middle">Prefix: a</text><rect x="490" y="30" width="240" height="52" rx="9" fill="#fee2e2" stroke="#475569"/><text x="610.0" y="61" text-anchor="middle">abb: reject</text><path d="M200,56 L485,56" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="342.5" y="44.0" text-anchor="middle" font-size="15">Append bb</text><rect x="30" y="130" width="170" height="52" rx="9" fill="#e8eefb" stroke="#475569"/><text x="115.0" y="161" text-anchor="middle">Prefix: aa</text><rect x="490" y="130" width="240" height="52" rx="9" fill="#dcfce7" stroke="#475569"/><text x="610.0" y="161" text-anchor="middle">aabb: accept</text><path d="M200,156 L485,156" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="342.5" y="144.0" text-anchor="middle" font-size="15">Append bb</text></g></svg>
