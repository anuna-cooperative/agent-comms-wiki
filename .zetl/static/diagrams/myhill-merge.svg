<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title"><title id="title">Merging distinguishable prefixes forces an error</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs><rect width="760" height="280" rx="12" fill="#ffffff"/><g font-family="system-ui, sans-serif" font-size="18" fill="#172033"><rect x="25" y="30" width="140" height="52" rx="9" fill="#e8eefb" stroke="#475569"/><text x="95.0" y="61" text-anchor="middle">Read a</text><rect x="25" y="150" width="140" height="52" rx="9" fill="#e8eefb" stroke="#475569"/><text x="95.0" y="181" text-anchor="middle">Read aa</text><rect x="260" y="90" width="220" height="52" rx="9" fill="#e8eefb" stroke="#475569"/><text x="370.0" y="121" text-anchor="middle">Same memory state</text><path d="M165,56 L255,112" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M165,176 L255,124" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="535" y="90" width="200" height="52" rx="9" fill="#e8eefb" stroke="#475569"/><text x="635.0" y="121" text-anchor="middle">Same decision</text><path d="M480,116 L530,116" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="505" y="75" text-anchor="middle" font-size="15">Read bb</text><text x="380" y="245" text-anchor="middle" fill="#991b1b">One of the two answers must be wrong.</text></g></svg>
