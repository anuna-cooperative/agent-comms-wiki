<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="title"><title id="title">Two states suffice to recognise an even number of a symbols</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs><rect width="760" height="220" rx="12" fill="#ffffff"/><g font-family="system-ui, sans-serif" font-size="18" fill="#172033"><rect x="160" y="85" width="230" height="52" rx="9" fill="#dcfce7" stroke="#475569"/><text x="275.0" y="116" text-anchor="middle">Even count: accept</text><rect x="495" y="85" width="230" height="52" rx="9" fill="#e8eefb" stroke="#475569"/><text x="610.0" y="116" text-anchor="middle">Odd count: reject</text><path d="M30,111 L155,111" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="92.5" y="99.0" text-anchor="middle" font-size="15">Start</text><path d="M330,85 C330,15 600,15 600,80" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="465" y="40" text-anchor="middle">a</text><path d="M600,137 C600,210 330,210 330,142" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="465" y="195" text-anchor="middle">a</text></g></svg>
